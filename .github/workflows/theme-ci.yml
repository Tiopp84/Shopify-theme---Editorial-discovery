name: Theme CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@4.5.1

      - name: Validate JSON, locales, and runtime policy
        run: node scripts/validate-theme.mjs

      - name: Run Theme Check
        env:
          SHOPIFY_CLI_NO_ANALYTICS: 1
        run: shopify theme check --path theme --fail-level error --no-color
